  <polygon points="76,32 84,24 92,32 84,40" fill="url(#diamondGrad)" stroke="#D96B27" stroke-width="0.8" />
  <line x1="84" y1="24" x2="84" y2="40" stroke="#FFFFFF" stroke-width="0.8" />
  <line x1="76" y1="32" x2="92" y2="32" stroke="#FFFFFF" stroke-width="0.8" />
</svg>
